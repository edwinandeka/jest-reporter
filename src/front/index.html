<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jest Reporter</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="toolbar">
      <h1>Jest Reporter - Results</h1>
    </div>

    <div id="toolbar-file" class="toolbar-file hidden">
      <button id="run-again-btn" class="toolbar-file-btn toolbar-file-btn-run" title="Run tests again">
        ▶ Run Again
      </button>
      <div class="toolbar-file-spacer"></div>
      <button id="open-file-btn" class="toolbar-file-btn" title="Open TypeScript file">
        Open File
      </button>
      <button id="open-test-btn" class="toolbar-file-btn" title="Open Test file">
        Open Test
      </button>
    </div>

    <div id="render">

    </div>

    <script src="main.js"></script>
  </body>
</html>
